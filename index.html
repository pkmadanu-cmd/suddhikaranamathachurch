<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suddhikarana Matha Church | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="cross-mark" aria-hidden="true">✝</div>
      <p class="eyebrow">Parish Records Management</p>
      <h1>Suddhikarana Matha Church</h1>
      <p class="church-name">Dharmaram</p>

      <div class="ornament"><span>✦</span></div>

      <form id="loginForm" class="login-form">
        <label for="email">Email Address</label>
        <input id="email" type="email" autocomplete="username" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>

        <label class="show-password-option">
          <input id="showPassword" type="checkbox">
          <span>Show Password</span>
        </label>

        <button id="loginButton" type="submit" class="primary-button">Sign In</button>
        <p id="loginMessage" class="form-message" role="alert"></p>
      </form>

      <p class="login-footer">Authorized parish office users only</p>
    </section>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
